[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom"
version = "0.1.0"
description = "PHANTOM: an offline first local AI presence for the terminal"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<0.7",
    "httpx>=0.27,<1",
    "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
phantom = "phantom.main:main"

[tool.setuptools.packages.find]
include = ["core*", "phantom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
